<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoS Prep</title>
  <style>
    :root { color-scheme: dark; --bg: transparent; --fg: #e6e6ef; --muted: #a0a0b4; --accent: #bb99ff; --ok: #7ddc8a; --warn: #ffb86b; --line: rgba(255,255,255,0.12); }
    body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
    .pad { padding: 12px 14px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
    section { padding: 0 14px 10px; border-bottom: 1px solid var(--line); }
    button { width: 100%; margin: 6px 0; padding: 9px; border-radius: 18px; border: 0; background: var(--accent); color: #1b1330; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    button:disabled { opacity: .5; cursor: default; }
    select { width: 100%; padding: 8px; border-radius: 8px; background: #2a2b3a; color: var(--fg); border: 1px solid var(--line); }
    ul { list-style: none; padding: 0; margin: 4px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
    .ok { color: var(--ok); } .missing { color: var(--warn); }
    .group { margin: 6px 0; }
    .note { color: var(--muted); font-size: 12px; }
    .small { color: var(--muted); font-size: 12px; }
    label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    #log { padding: 6px 14px 0; font-size: 12px; max-height: 120px; overflow: auto; }
    .msg { padding: 4px 0; border-bottom: 1px dashed var(--line); }
    .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }
  </style>
</head>
<body>
  <div id="log"></div>
  <section>
    <h2>1. Monsterbilder</h2>
    <div class="small">Välj monstrens bilder från dina assets (en gång). Bilderna måste heta exakt som monstret.</div>
    <ul id="tokens"></ul>
    <button id="pickBtn" class="secondary">Välj monsterbilder</button>
  </section>
  <section>
    <h2>2. Plats</h2>
    <select id="location"></select>
    <div id="groups"></div>
    <div id="placedInfo" class="small"></div>
    <button id="placeBtn">Placera dolda monster</button>
    <label><input type="checkbox" id="force" /> Placera ändå om kartans namn inte matchar</label>
    <button id="verifyBtn" class="secondary">Kontrollera placering</button>
    <button id="removeBtn" class="secondary">Ta bort platsens monster</button>
  </section>
  <section>
    <h2>3. Spelare</h2>
    <button id="syncBtn">Synka spelare</button>
    <button id="playersBtn" class="secondary">Visa spelarnas koppling</button>
  </section>
  <div class="small pad">CoS Prep v1.0.7</div>
  <script type="module" src="./main.js?v=107"></script>
</body>
</html>
